[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --timeout=120
# No per-test bound meant a single stuck test (e.g. a real model load/download
# stalling on a flaky CI network) could run until GitHub Actions' own 6hr job
# timeout killed the whole run. 120s is well above the ~3s warm-model cost
# noted in core/daemon.py, so a real hang now fails fast and legibly instead.
